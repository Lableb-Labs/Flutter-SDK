include: package:lints/recommended.yaml

linter:
  rules:
    - always_declare_return_types
    - avoid_empty_else
    - avoid_print
    - avoid_relative_lib_imports
    - avoid_types_as_parameter_names
    - cancel_subscriptions
    - close_sinks
    - control_flow_in_finally
    - empty_catches
    - empty_constructor_bodies
    - library_names
    - library_prefixes
    - no_duplicate_case_values
    - prefer_is_empty
    - prefer_is_not_empty
    - prefer_single_quotes
    - slash_for_doc_comments
    - sort_child_properties_last
    - type_annotate_public_apis
    - unawaited_futures
    - use_key_in_widget_constructors
    # Not in lints/recommended.yaml. Without it the package's own deprecations
    # are invisible in-package, so README snippets and example/ could document
    # deprecated APIs with a clean `flutter analyze`. Note this is a LINT rule:
    # putting it under `analyzer: errors:` is silently inert.
    - deprecated_member_use_from_same_package

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
  errors:
    invalid_annotation_target: ignore

